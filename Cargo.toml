[package]
name = "ds-authority-governance-ui"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Yew SPA for governing an Eclipse EDC IdentityHub Issuer Service: credential-definition authoring, holder approval, credential/issuance lifecycle"
repository = "https://github.com/ds-labs-org/ds-authority-governance-ui"
keywords = ["dataspace", "dcp", "yew"]
readme = "README.md"

[dependencies]
console_error_panic_hook = "0.1"
# Bumped from `feat/issuer-admin-api-integrated` to `feat/identity-bootstrap-client`
# (branched off it, a strict superset -- confirmed by reading its history:
# the credential-definitions/holders/credentials/issuance-processes clients
# this crate already depends on are all still there, merged in unchanged).
# The bump is required, not optional: the startup DID-bootstrap check in
# `main.rs` calls `get_participants`/`get_did_state`, and `get_did_state`
# does not exist at all before this branch.
edc-identity-hub-client = { git = "https://github.com/ds-labs-org/edc-identity-hub-client.git", branch = "feat/identity-bootstrap-client" }
# `ds-identity-bootstrap-ui` now ships real components on
# `feat/wizard-components` (see `src/views/identity_bootstrap.rs`), so this
# is back to a plain mandatory dependency -- no more `optional`/feature gate.
ds-identity-bootstrap-ui = { git = "https://github.com/ds-labs-org/ds-identity-bootstrap-ui.git", branch = "feat/wizard-components" }
patternfly-yew = { version = "0.8.2", features = ["experimental"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
web-sys = { version = "0.3", features = ["Window", "Location", "Document"] }
yew = { version = "0.23.0", features = ["csr"] }
yew-router = "0.20.0"
yewdux = "0.13.0"

[dev-dependencies]
# Only used to yield a tick to Yew's scheduler between mounting a component
# in a wasm-bindgen-test and asserting on its rendered DOM.
gloo-timers = { version = "0.3", features = ["futures"] }
serde_json = "1"
wasm-bindgen-test = "0.3"
