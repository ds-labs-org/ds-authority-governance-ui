[package]
name = "ds-authority-governance-ui"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Yew SPA for governing an Eclipse EDC IdentityHub Issuer Service: credential-definition authoring, holder approval, credential/issuance lifecycle"
repository = "https://github.com/ds-labs-org/ds-authority-governance-ui"
keywords = ["dataspace", "dcp", "yew"]
readme = "README.md"

[dependencies]
console_error_panic_hook = "0.1"
edc-identity-hub-client = { git = "https://github.com/ds-labs-org/edc-identity-hub-client.git", branch = "feat/v1beta-and-issuer-admin-api" }
ds-identity-bootstrap-ui = { git = "https://github.com/ds-labs-org/ds-identity-bootstrap-ui.git", branch = "main" }
patternfly-yew = { version = "0.8.2", features = ["experimental"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
web-sys = { version = "0.3", features = ["Window", "Location"] }
yew = { version = "0.23.0", features = ["csr"] }
yew-router = "0.20.0"
yewdux = "0.13.0"

[dev-dependencies]
serde_json = "1"
wasm-bindgen-test = "0.3"
